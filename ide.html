<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Revora IDE</title>
<style>
:root{
  --bg:#1e1e1e;--side:#252526;--act:#333333;--tabbg:#2d2d2d;--line:#3c3c3c;--text:#cccccc;--dim:#8b8b8b;--hi:#ffffff;
  --sel:#37373d;--selact:#04395e;--btn:#0e639c;--btnh:#1177bb;--status:#007acc;--err:#f48771;--ok:#89d185;--warn:#cca700;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#424242;border-radius:5px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:#4f4f4f;background-clip:content-box;border:2px solid transparent}

/* title bar */
#title{height:38px;background:#323233;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid #252526;flex:none}
#title .brand{font-weight:600;color:var(--hi);letter-spacing:.02em;display:flex;align-items:center;gap:7px}
#title .brand i{width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,#1877F2,#6ea8ff);display:inline-block}
#site{background:#3c3c3c;border:1px solid #4a4a4a;border-radius:5px;padding:4px 8px;max-width:260px;outline:none}
#site:focus{border-color:var(--status)}
.sp{flex:1}
.tb{display:flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:5px;color:var(--text)}
.tb:hover{background:#3c3c3c}.tb.on{background:#3c3c3c;color:var(--hi)}
.tb.pri{background:var(--btn);color:#fff}.tb.pri:hover{background:var(--btnh)}
.tb:disabled{opacity:.45;cursor:default}
#palette{background:#3c3c3c;border:1px solid #4a4a4a;border-radius:6px;padding:3px 40px;color:var(--dim);min-width:220px;text-align:center}
#palette:hover{border-color:#5a5a5a;color:var(--text)}
.modes{display:flex;background:#3c3c3c;border-radius:6px;padding:2px}
.modes button{padding:3px 11px;border-radius:5px;color:var(--dim)}
.modes button.on{background:var(--sel);color:var(--hi)}
.modes button:hover:not(.on){color:var(--text)}

/* body */
#app{flex:1;display:flex;min-height:0}
#act{width:48px;background:var(--act);display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:2px;flex:none}
#act button{width:48px;height:46px;display:flex;align-items:center;justify-content:center;color:#858585;border-left:2px solid transparent}
#act button svg{width:23px;height:23px}
#act button:hover{color:var(--hi)}#act button.on{color:var(--hi);border-left-color:var(--hi)}
#side{width:260px;background:var(--side);display:flex;flex-direction:column;min-width:0;flex:none}
.shead>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}.shead{height:35px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#bbb;flex:none}
.shead .ic{display:flex;gap:2px}
.ib{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:#c5c5c5}
.ib:hover{background:#3c3c3c;color:var(--hi)}.ib svg{width:16px;height:16px}
.panel{flex:1;overflow:auto;display:none;min-height:0}.panel.on{display:block}
#tree .row{display:flex;align-items:center;gap:5px;height:24px;padding-right:6px;cursor:pointer;white-space:nowrap;color:#ccc;position:relative}
#tree .row:hover{background:#2a2d2e}#tree .row.sel{background:var(--sel);color:var(--hi)}#tree .row.cur{background:var(--selact);color:var(--hi)}
#tree .chev{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:#c5c5c5;flex:none}
#tree .chev svg{width:12px;height:12px;transition:transform .1s}#tree .chev.open svg{transform:rotate(90deg)}
#tree .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
#tree .acts{display:none;gap:0}#tree .row:hover .acts{display:flex}
#tree .dot{color:#e2c08d;font-size:10px}
.fi{width:16px;height:16px;border-radius:3px;font-size:8.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#1e1e1e;flex:none;letter-spacing:-.3px}
.fi.html{background:#e44d26}.fi.css{background:#4b9be0}.fi.js{background:#f1dd3f}.fi.json{background:#cbcb41}.fi.img{background:#a074c4}.fi.md{background:#519aba}.fi.other{background:#8b8b8b}
.fold{width:16px;height:16px;color:#c09553;flex:none}.fold svg{width:16px;height:16px;fill:#c09553;stroke:none}
.empty{padding:20px;color:var(--dim);line-height:1.6}
.empty b{color:var(--text)}
.sbox{padding:6px 12px 10px}
.sbox input{width:100%;background:#3c3c3c;border:1px solid transparent;border-radius:4px;padding:5px 8px;outline:none}.sbox input:focus{border-color:var(--status)}
.hit{padding:3px 12px 3px 20px;cursor:pointer;color:#ccc;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit:hover{background:#2a2d2e}.hit .ln{color:var(--dim);margin-right:6px}
.hf{padding:5px 12px;font-weight:600;color:#ddd;font-size:12px}
.asset{display:flex;gap:10px;align-items:center;padding:6px 12px}
.asset img{width:44px;height:44px;object-fit:cover;border-radius:4px;background:#111}
.asset .a2{min-width:0;flex:1}.asset .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{padding:2px 8px;border-radius:4px;background:#3c3c3c;font-size:11px;margin-right:4px}.mini:hover{background:#4a4a4a;color:var(--hi)}
.rz{width:4px;cursor:col-resize;flex:none;margin:0 -2px;z-index:5;position:relative}.rz:hover,.rz.drag{background:var(--status);opacity:.6}

/* editor */
#mid{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{height:35px;background:var(--side);display:flex;overflow-x:auto;overflow-y:hidden;flex:none}
#tabs::-webkit-scrollbar{height:4px}
.tab{display:flex;align-items:center;gap:7px;padding:0 10px 0 12px;background:var(--tabbg);border-right:1px solid var(--side);color:#969696;cursor:pointer;white-space:nowrap;min-width:0}
.tab.on{background:var(--bg);color:var(--hi);box-shadow:inset 0 1px 0 var(--status)}
.tab .x{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;opacity:0}
.tab:hover .x,.tab.on .x,.tab.dirty .x{opacity:1}.tab .x:hover{background:#4a4a4a}
.tab.dirty .x svg{display:none}.tab.dirty .x::after{content:"";width:9px;height:9px;border-radius:50%;background:#ccc}.tab.dirty .x:hover::after{display:none}.tab.dirty .x:hover svg{display:block}
#crumbs{height:24px;display:flex;align-items:center;gap:5px;padding:0 14px;color:var(--dim);font-size:12px;flex:none;background:var(--bg)}
#crumbs b{color:#bbb;font-weight:400}
#ed{flex:1;min-height:0;position:relative}
#welcome{position:absolute;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;overflow:auto;padding:24px;z-index:3}
#welcome.on{display:flex}
.wl{max-width:560px;width:100%}
.wl h1{font-size:26px;font-weight:300;color:var(--hi);margin-bottom:4px}
.wl .sub{color:var(--dim);margin-bottom:26px}
.wl h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#bbb;margin:20px 0 8px;font-weight:600}
.wa{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:6px;width:100%;text-align:left}
.wa:hover{background:#2a2d2e}.wa svg{margin-top:2px;color:#4fc1ff}.wa b{display:block;color:#4fc1ff;font-weight:500}.wa span{color:var(--dim)}
.keys{color:var(--dim);font-size:12px;line-height:2}.keys kbd{background:#333;border:1px solid #444;border-radius:4px;padding:1px 6px;font:11px ui-monospace,Menlo,monospace;color:#ccc}

/* right pane */
#right{width:42%;max-width:760px;min-width:280px;background:var(--side);display:flex;flex-direction:column;flex:none}
.rtabs{height:35px;display:flex;align-items:center;padding:0 6px;gap:2px;border-bottom:1px solid var(--line);flex:none}
.rtabs button{padding:0 12px;height:35px;color:#969696;border-bottom:1px solid transparent;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.rtabs button.on{color:var(--hi);border-bottom-color:var(--status)}
.rtabs .sp{flex:1}
#pvbar{display:flex;align-items:center;gap:4px;padding:5px 8px;border-bottom:1px solid var(--line);flex:none}
#pvbar select{background:#3c3c3c;border:1px solid #4a4a4a;border-radius:4px;padding:2px 5px;font-size:12px;outline:none}
#pvbar .note{color:var(--dim);font-size:11px;margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:35%}
#pvwrap{flex:1;background:#2b2b2b;overflow:auto;display:flex;justify-content:center;min-height:0;padding:0}
#pvbox{width:100%;height:100%;background:#fff;transition:width .15s}
#pvbox.dtab{width:768px;max-width:100%;margin:10px 0;height:calc(100% - 20px);box-shadow:0 0 0 1px #444}
#pvbox.dmob{width:390px;max-width:100%;margin:10px 0;height:calc(100% - 20px);box-shadow:0 0 0 1px #444;border-radius:14px;overflow:hidden}
#pv{width:100%;height:100%;border:0;background:#fff;display:block}
#chat{flex:1;display:none;flex-direction:column;min-height:0}
#chat.on{display:flex}
#log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column;gap:4px;max-width:100%}
.msg .who{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.msg .bd{white-space:pre-wrap;word-wrap:break-word;line-height:1.55;color:#d4d4d4}
.msg.u .bd{background:#2f3a47;border:1px solid #3b4a5c;border-radius:8px;padding:8px 11px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{background:#3c3c3c;border-radius:10px;padding:2px 9px;font-size:11.5px;color:#9cdcfe;cursor:pointer}.chip:hover{background:#4a4a4a}
.sys{color:var(--dim);font-size:12px;text-align:center}
.thinking{color:var(--dim)}.thinking::after{content:"...";animation:dots 1.2s infinite steps(4,end);display:inline-block;width:1.2em;overflow:hidden;vertical-align:bottom}
@keyframes dots{0%{width:0}100%{width:1.2em}}
#chatf{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex:none}
#chatin{width:100%;min-height:64px;max-height:180px;resize:vertical;background:#3c3c3c;border:1px solid #4a4a4a;border-radius:6px;padding:8px 10px;outline:none}#chatin:focus{border-color:var(--status)}
.row2{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:11.5px}
.send{background:var(--btn);color:#fff;border-radius:5px;padding:5px 14px}.send:hover{background:var(--btnh)}.send:disabled{opacity:.5}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ex button{background:#2f2f31;border:1px solid #3c3c3c;border-radius:12px;padding:3px 10px;color:#bbb;font-size:12px}.ex button:hover{border-color:var(--status);color:var(--hi)}

/* status bar */
#status{height:22px;background:var(--status);color:#fff;display:flex;align-items:center;padding:0 10px;gap:16px;font-size:12px;flex:none}
#status .sp{flex:1}#status.err{background:#a1260d}#status.busy{background:#68217a}
#status span{white-space:nowrap}
#status button{color:#fff;padding:0 4px;height:22px}#status button:hover{background:rgba(255,255,255,.15)}

/* quick input / dialogs */
#qo{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding-top:70px;background:rgba(0,0,0,.35);z-index:50}
#qo.on{display:flex}
#qb{width:min(580px,calc(100vw - 24px));background:#252526;border:1px solid #454545;border-radius:7px;box-shadow:0 8px 30px rgba(0,0,0,.6);overflow:hidden}
#qb .q1{padding:10px 12px;border-bottom:1px solid #3c3c3c}
#qb .t{font-size:12px;color:var(--dim);padding:10px 12px 0}
#qb input{width:100%;background:#3c3c3c;border:1px solid #4a4a4a;border-radius:4px;padding:7px 9px;outline:none}#qb input:focus{border-color:var(--status)}
#ql{max-height:300px;overflow:auto;padding:4px 0}
.qi{padding:5px 14px;display:flex;gap:9px;align-items:center;cursor:pointer;white-space:nowrap;overflow:hidden}
.qi.on{background:var(--selact);color:var(--hi)}.qi .d{color:var(--dim);margin-left:auto;font-size:11.5px;padding-left:12px}
#qb .msg2{padding:12px 14px;color:#d4d4d4;line-height:1.55;white-space:pre-wrap}
#qb .btns{display:flex;gap:8px;justify-content:flex-end;padding:10px 12px;border-top:1px solid #3c3c3c}
#qb .btns button{padding:5px 14px;border-radius:5px;background:#3c3c3c}#qb .btns button.pri{background:var(--btn);color:#fff}
.field{padding:6px 12px}.field label{display:block;color:var(--dim);font-size:11.5px;margin-bottom:4px}
.field select,.field input[type=text]{width:100%;background:#3c3c3c;border:1px solid #4a4a4a;border-radius:4px;padding:7px 9px;outline:none}

/* narrow screens: one pane at a time */
#mnav{display:none}
@media (max-width:860px){
  #palette,#title .brand span{display:none}
  #act{display:none}
  #mnav{display:flex;background:var(--act);flex:none}
  #mnav button{flex:1;padding:9px 0;color:#999;border-top:2px solid transparent}
  #mnav button.on{color:var(--hi);border-top-color:var(--status);background:var(--side)}
  .rz{display:none}
  #side,#mid,#right{width:100%!important;max-width:none;display:none;flex:1}
  body[data-v="files"] #side{display:flex}
  body[data-v="code"] #mid{display:flex}
  body[data-v="preview"] #right,body[data-v="ai"] #right{display:flex}
  .modes{display:none}
}
</style>
</head>
<body data-v="code">
<div id="title">
  <div class="brand"><i></i><span>Revora IDE</span></div>
  <select id="site" title="Switch site"></select>
  <span class="sp"></span>
  <button id="palette" title="Quick open (Ctrl+P)">Search files…  Ctrl+P</button>
  <span class="sp"></span>
  <div class="modes" id="modes"><button data-m="widget" title="The visual builder">Widget</button><button data-m="ai" title="Chat with the AI about your site">AI chat</button><button data-m="ide" class="on" title="Code view">IDE</button></div>
  <button class="tb" id="tSide" title="Show or hide files (Ctrl+B)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
  <button class="tb" id="tRight" title="Show or hide the preview / AI pane"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
  <button class="tb" id="bTest" title="Open the real page in a new tab"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
  <button class="tb" id="bSave" disabled title="Save (Ctrl+S)">Save</button>
  <button class="tb pri" id="bLive" disabled>Publish</button>
</div>
<div id="app">
  <div id="act">
    <button data-p="explorer" class="on" title="Files (Ctrl+Shift+E)"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></button>
    <button data-p="search" title="Search in all files (Ctrl+Shift+F)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/></svg></button>
    <button data-p="assets" title="Images and assets"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg></button>
    <button data-p="ai" title="AI chat"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></svg></button>
  </div>
  <div id="side">
    <div class="panel on" id="p-explorer" style="display:flex;flex-direction:column">
      <div class="shead"><span id="sname">Explorer</span><span class="ic"><button class="ib" id="iNew" title="New file"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M12 11v6M9 14h6"/></svg></button><button class="ib" id="iUp" title="Upload an image or file"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></button><button class="ib" id="iRef" title="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button><button class="ib" id="iCol" title="Collapse folders"><svg viewBox="0 0 24 24"><path d="M5 8l7 7 7-7"/></svg></button></span></div>
      <div id="tree" style="flex:1;overflow:auto"></div>
    </div>
    <div class="panel" id="p-search"><div class="shead"><span>Search</span></div><div class="sbox"><input id="q" placeholder="Search in all files, press Enter"></div><div id="hits"></div></div>
    <div class="panel" id="p-assets"><div class="shead"><span>Assets</span><span class="ic"><button class="ib" id="aUp" title="Upload"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></button></span></div><div id="alist"></div></div>
  </div>
  <div class="rz" id="rz1"></div>
  <div id="mid">
    <div id="tabs"></div>
    <div id="crumbs"></div>
    <div id="ed">
      <div id="welcome">
        <div class="wl">
          <h1>Revora IDE</h1><div class="sub">Build your website with real code, with the AI beside you.</div>
          <h3>Start</h3>
          <button class="wa" id="wNew"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M12 11v6M9 14h6"/></svg><div><b>New site</b><span>A fresh site with index.html, thanks.html, styles.css and scripts.js, ready to edit.</span></div></button>
          <button class="wa" id="wImp"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg><div><b>Import your own site (.zip)</b><span>Upload a website folder as a .zip. Your pages, scripts, forms and pixel stay exactly as written.</span></div></button>
          <button class="wa" id="wAi"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/></svg><div><b>Ask the AI to build it</b><span>Describe the page and the AI writes the files. Then you can edit them by hand.</span></div></button>
          <h3>Shortcuts</h3>
          <div class="keys"><kbd>Ctrl</kbd> <kbd>P</kbd> open a file &nbsp; <kbd>Ctrl</kbd> <kbd>S</kbd> save &nbsp; <kbd>Ctrl</kbd> <kbd>B</kbd> hide files<br><kbd>Ctrl</kbd> <kbd>Shift</kbd> <kbd>F</kbd> search all files &nbsp; <kbd>Alt</kbd> <kbd>Shift</kbd> <kbd>F</kbd> format code &nbsp; <kbd>Ctrl</kbd> <kbd>Space</kbd> suggestions</div>
        </div>
      </div>
    </div>
  </div>
  <div class="rz" id="rz2"></div>
  <div id="right">
    <div class="rtabs"><button data-r="preview" class="on">Preview</button><button data-r="ai">AI chat</button><span class="sp"></span><button class="ib" id="rClose" title="Hide this pane"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div id="pane-preview" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div id="pvbar">
        <select id="pvmode" title="Quick shows your unsaved edits at once. Live page shows the real site after you save."><option value="quick">Quick</option><option value="live">Live page</option></select>
        <button class="ib" data-dev="desk" title="Desktop"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg></button>
        <button class="ib" data-dev="dtab" title="Tablet"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
        <button class="ib" data-dev="dmob" title="Phone"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
        <button class="ib" id="pvRef" title="Refresh preview"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
        <span class="note" id="pvnote"></span>
      </div>
