<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Your Order</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --bg2:#faf9f7;
  --text:#14130f; --text2:#55524a; --muted:#8c887c;
  --border:#e7e3da; --borderStrong:#d6d1c4;
  --accent:#1a7a5e; --accentDk:#125c46; --accentBg:#eaf4f0; --accentBdr:#cfe6dd;
  --danger:#b4493c; --dangerBg:#fbeeec;
  --shadow:0 1px 2px rgba(20,19,15,.03), 0 16px 40px -20px rgba(20,19,15,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);
  color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.6;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Fraunces',Georgia,serif;}
.wrap{max-width:520px;margin:0 auto;padding:28px 16px 70px;}
.brandbar{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;}
.brandbar::before,.brandbar::after{content:"";height:1px;width:28px;background:linear-gradient(90deg,transparent,var(--border));}
.brandbar::after{background:linear-gradient(90deg,var(--border),transparent);}
.card{
  background:#fff;
  border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px;
  box-shadow:var(--shadow);
  position:relative;
}
.prod-photo{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-bottom:16px;background:var(--bg2);display:block;}
h1{font-family:'Fraunces',Georgia,serif;font-size:24px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px;}
.price{font-family:'Fraunces',Georgia,serif;font-size:30px;font-weight:600;letter-spacing:-.01em;color:var(--accent);margin:8px 0 2px;}
.muted{color:var(--muted);font-size:12.5px;font-weight:500;}
.desc{color:var(--text2);font-size:14px;margin-top:12px;white-space:pre-wrap;line-height:1.6;}
.safety{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--muted);margin-top:14px;line-height:1.55;}
.field{margin-bottom:14px;}
label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:6px;font-weight:600;letter-spacing:.01em;}
input,select,textarea{
  width:100%;background:#fff;border:1.5px solid var(--border);color:var(--text);
  border-radius:8px;padding:12.5px 13px;font-size:16px;font-family:inherit;
  transition:border-color .15s ease, box-shadow .15s ease;
}
input::placeholder{color:var(--muted);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accentBg);}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.qty-row{display:flex;align-items:center;gap:12px;}
.qty-btn{width:42px;height:42px;border-radius:8px;background:var(--bg2);border:1.5px solid var(--border);color:var(--text);font-size:19px;cursor:pointer;font-weight:600;transition:background .15s ease,border-color .15s ease;}
.qty-btn:hover{border-color:var(--borderStrong);}
.qty-btn:active{transform:scale(.96);}
.qty-val{width:48px;text-align:center;font-weight:700;font-size:17px;font-family:'Fraunces',Georgia,serif;}
.tier-grid{display:flex;flex-direction:column;gap:9px;}
.tier-card{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:13px 14px;cursor:pointer;transition:border-color .15s ease,background .15s ease;position:relative;}
.tier-card:hover{border-color:var(--borderStrong);}
.tier-card.selected{border-color:var(--accent);background:var(--accentBg);}
.tier-card .tc-label{font-weight:600;font-size:15px;}
.tier-card .tc-badge{display:inline-block;font-size:10px;font-weight:700;color:var(--accentDk);background:#fff;border:1px solid var(--accentBdr);border-radius:20px;padding:2px 8px;margin-left:7px;letter-spacing:.01em;}
.tier-card .tc-price{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:17px;color:var(--text);white-space:nowrap;}
.total-row{display:flex;justify-content:space-between;align-items:baseline;padding:16px 2px;border-top:1px dashed var(--border);margin-top:8px;}
.total-row span:first-child{font-size:14px;color:var(--text2);font-weight:600;}
.total-row span:last-child{font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:600;color:var(--text);}
button[type=submit]{
  width:100%;background:var(--accent);
  color:#fff;border:none;border-radius:8px;padding:16px;
  font-size:16px;font-weight:600;letter-spacing:-.005em;cursor:pointer;margin-top:8px;
  transition:background .15s ease;
}
button[type=submit]:hover{background:var(--accentDk);}
button[type=submit]:disabled{opacity:.6;cursor:default;}
.msg{border-radius:8px;padding:11px 13px;font-size:13.5px;margin-top:12px;display:none;font-weight:500;}
.msg.err{background:var(--dangerBg);color:var(--danger);display:block;border:1px solid #f0d9d4;}
.secure{text-align:center;color:var(--muted);font-size:12px;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px;}
#thankyou{display:none;text-align:center;padding:70px 20px;}
#thankyou .check{
  width:64px;height:64px;border-radius:50%;
  background:var(--accentBg);border:1.5px solid var(--accentBdr);
  color:var(--accent);font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
}
#thankyou h1{font-size:26px;font-family:'Fraunces',Georgia,serif;}
#thankyou p{color:var(--text2);margin-top:12px;font-size:15px;max-width:360px;margin-left:auto;margin-right:auto;}
.ref{margin-top:20px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-size:12px;background:var(--bg2);border:1px solid var(--border);display:inline-block;padding:8px 14px;border-radius:8px;letter-spacing:.03em;}
#loadErr, #loading{text-align:center;padding:70px 20px;color:var(--muted);font-size:14.5px;}
</style>
</head>
<body>

<div class="wrap" id="page">
  <div id="loading">Loading order form…</div>
</div>

<div class="wrap" id="thankyou">
  <div class="check">✓</div>
  <h1>Order received!</h1>
  <p>Thank you. Our team will call you shortly to confirm your order and delivery details.</p>
  <div class="ref" id="orderRef"></div>
</div>

<script>
// ── Config: same pattern as every other CRM-connected page in this repo ──────
const SUPABASE_URL = "https://rrkhkhgdxhmogxxtbvyt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJya2hraGdkeGhtb2d4eHRidnl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNTc3ODgsImV4cCI6MjEwMTYzMzc4OH0.zAWC-s3PVsYi_EIHibbqLkCQ0u095ppDh-2l_DA-_Pc";

const NIGERIA_STATES = ["Abia","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno","Cross River","Delta","Ebonyi","Edo","Ekiti","Enugu","FCT (Abuja)","Gombe","Imo","Jigawa","Kaduna","Kano","Katsina","Kebbi","Kogi","Kwara","Lagos","Nasarawa","Niger","Ogun","Ondo","Osun","Oyo","Plateau","Rivers","Sokoto","Taraba","Yobe","Zamfara"];

function qp(name) { return new URLSearchParams(location.search).get(name); }
function getCookie(name) {
  const m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
  return m ? decodeURIComponent(m[1]) : null;
}
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = (Math.random() * 16) | 0;
    return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
  });
}
function fmt(n, currency) {
  return new Intl.NumberFormat("en-NG", { style: "currency", currency: currency || "NGN", maximumFractionDigits: 0 }).format(n || 0);
}
function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const productId = qp("product");
// Attribution the sales page carries through in its own link (added by the
// dashboard's "Copy order form link" -- see Products tab): which media buyer
// gets credit, plus Meta's own ad set / creative / click ids for CAPI match
// quality, same fields receive-order already accepts from sales-ginaris-herbal.html.
const buyerCode = qp("buyer");
const asid = qp("asid");
const crid = qp("crid");
const fbclid = qp("fbclid");

let product = null;
let qty = 1;
let selectedTierId = null;

async function loadProduct() {
  if (!productId) {
    document.getElementById("page").innerHTML = `<div id="loadErr">This order link is missing a product. Check the link you copied from the dashboard's Products tab.</div>`;
    return;
  }
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-product-public?id=${encodeURIComponent(productId)}`, {
      headers: { Authorization: `Bearer ${SUPABASE_ANON_KEY}`, apikey: SUPABASE_ANON_KEY },
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    product = data;
    renderForm();
    if (product.meta_pixel_id) initPixel(product.meta_pixel_id);
  } catch (err) {
    document.getElementById("page").innerHTML = `<div id="loadErr">Sorry, this order form isn't available right now. (${esc(err.message)})</div>`;
  }
}

function initPixel(pixelId) {
  /* eslint-disable */
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', pixelId);
  fbq('track', 'PageView');
  /* eslint-enable */
}

function renderForm() {
  const stateOptions = NIGERIA_STATES.map(s => `<option>${s}</option>`).join("");
  const hasTiers = Array.isArray(product.tiers) && product.tiers.length > 0;
  if (hasTiers && !selectedTierId) {
    // Default to the tier already flagged best-value if there is one, else the first.
    selectedTierId = (product.tiers.find(t => t.badge) || product.tiers[0]).id;
  }

  document.getElementById("page").innerHTML = `
    <div class="brandbar">Secure Checkout</div>
    <div class="card">
      ${product.product_image_url ? `<img class="prod-photo" src="${esc(product.product_image_url)}" alt="">` : ""}
      <h1>${esc(product.product_name)}</h1>
      ${!hasTiers ? `
        <div class="price" id="priceDisplay">${fmt(product.default_order_value_naira, product.currency)}</div>
        <div class="muted">per unit</div>` : ""}
      ${product.description ? `<div class="desc">${esc(product.description)}</div>` : ""}
      ${product.benefits ? `<div class="desc">${esc(product.benefits)}</div>` : ""}
      ${(product.safety_notes || product.nafdac_reg_no) ? `<div class="safety">${product.safety_notes ? esc(product.safety_notes) : ""}${product.nafdac_reg_no ? ` NAFDAC Reg. No. ${esc(product.nafdac_reg_no)}.` : ""} This is a food supplement, not a substitute for medicine prescribed by a doctor.</div>` : ""}
    </div>

    <form id="orderForm" class="card">
      <div id="formMsg" class="msg"></div>
      ${hasTiers ? `
      <div class="field">
        <label>Choose your package</label>
        <div class="tier-grid" id="tierGrid">
          ${product.tiers.map(t => `
            <div class="tier-card${t.id === selectedTierId ? " selected" : ""}" data-tier="${esc(t.id)}">
              <div><span class="tc-label">${esc(t.label)}</span>${t.badge ? `<span class="tc-badge">${esc(t.badge)}</span>` : ""}</div>
              <div class="tc-price">${fmt(t.price_naira, product.currency)}</div>
            </div>`).join("")}
        </div>
      </div>` : `
      <div class="field">
        <label>Quantity</label>
        <div class="qty-row">
          <button type="button" class="qty-btn" id="qtyMinus">−</button>
          <div class="qty-val" id="qtyVal">1</div>
          <button type="button" class="qty-btn" id="qtyPlus">+</button>
        </div>
      </div>`}
      <div class="field"><label>Full name *</label><input id="f_name" required placeholder="Your full name"></div>
      <div class="field"><label>Phone number *</label><input id="f_phone" type="tel" required placeholder="080..."></div>
      <div class="field"><label>Delivery address *</label><input id="f_address" required placeholder="House number, street"></div>
      <div class="fg2">
        <div class="field"><label>City *</label><input id="f_city" required placeholder="City"></div>
        <div class="field"><label>State *</label><select id="f_state" required><option value="">Select state</option>${stateOptions}</select></div>
      </div>
      <div class="field"><label>Payment method *</label>
        <select id="f_payment" required>
          <option value="Pay on delivery">Pay on delivery</option>
          <option value="Bank transfer">Bank transfer</option>
        </select>
      </div>
      <div class="total-row"><span>Order total</span><span id="totalDisplay">${fmt(hasTiers ? currentTierPrice() : product.default_order_value_naira, product.currency)}</span></div>
      <button type="submit" id="submitBtn">Complete Order</button>
      <div class="secure">🔒 Your details are kept private &middot; a team member will call to confirm</div>
    </form>
  `;

  if (hasTiers) {
    document.querySelectorAll(".tier-card").forEach(card => card.addEventListener("click", () => {
      selectedTierId = card.dataset.tier;
      document.querySelectorAll(".tier-card").forEach(c => c.classList.toggle("selected", c.dataset.tier === selectedTierId));
      document.getElementById("totalDisplay").textContent = fmt(currentTierPrice(), product.currency);
    }));
  } else {
    const qtyVal = document.getElementById("qtyVal");
    const updateTotals = () => {
      const total = (product.default_order_value_naira || 0) * qty;
      document.getElementById("totalDisplay").textContent = fmt(total, product.currency);
      qtyVal.textContent = qty;
    };
    document.getElementById("qtyMinus").addEventListener("click", () => { if (qty > 1) { qty--; updateTotals(); } });
    document.getElementById("qtyPlus").addEventListener("click", () => { if (qty < 20) { qty++; updateTotals(); } });
  }

  document.getElementById("orderForm").addEventListener("submit", onSubmit);
}

function currentTierPrice() {
  const t = (product.tiers || []).find(t => t.id === selectedTierId);
  return t ? t.price_naira : product.default_order_value_naira;
}

async function onSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("formMsg");
  msg.style.display = "none";

  const name = document.getElementById("f_name").value.trim();
  const phone = document.getElementById("f_phone").value.trim();
  const address = document.getElementById("f_address").value.trim();
  const city = document.getElementById("f_city").value.trim();
  const state = document.getElementById("f_state").value;
  const payment = document.getElementById("f_payment").value;
  if (!name || !phone || !address || !city || !state) return;

  const hasTiers = Array.isArray(product.tiers) && product.tiers.length > 0;
  const selectedTier = hasTiers ? (product.tiers.find(t => t.id === selectedTierId) || product.tiers[0]) : null;
  const eventId = uuid();
  const orderQty = selectedTier ? selectedTier.quantity : qty;
  const value = selectedTier ? selectedTier.price_naira : (product.default_order_value_naira || 0) * qty;

  const payload = {
    event_id: eventId,
    customer_name: name,
    phone,
    customer_address: address,
    customer_city: city,
    customer_state: state,
    customer_country: "NG",
    payment_method: payment,
    product_id: productId,
    tier_id: selectedTier ? selectedTier.id : undefined,
    product_name: selectedTier ? `${product.product_name} (${selectedTier.label})` : product.product_name,
    quantity: orderQty,
    order_value_naira: value,
    currency: product.currency || "NGN",
    ad_set_id: asid || null,
    creative_id: crid || null,
    buyer: buyerCode || undefined,
    fbclid: fbclid || undefined,
    fbp: getCookie("_fbp") || undefined,
    fbc: getCookie("_fbc") || undefined,
  };

  btn.disabled = true;
  btn.textContent = "Submitting…";

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/receive-order`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    if (typeof fbq === "function") {
      fbq("track", "Purchase", { value, currency: product.currency || "NGN" }, { eventID: eventId });
    }

    document.getElementById("page").style.display = "none";
    document.getElementById("orderRef").textContent = "Reference: " + eventId.slice(0, 8).toUpperCase();
    document.getElementById("thankyou").style.display = "block";
    window.scrollTo(0, 0);
  } catch (err) {
    msg.textContent = "Something went wrong, please try again. (" + err.message + ")";
    msg.className = "msg err";
    msg.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Complete Order";
  }
}

loadProduct();
</script>
</body>
</html>
