<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect to Revora</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mu:#6e6e73;--ac:#0071e3;--bd:#e5e5ea}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--bd:#2c2c2e}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:28px;max-width:420px;width:100%}
.logo{width:56px;height:56px;border-radius:14px;display:block;margin:0 0 14px}h1{font-size:20px;margin:0 0 6px}p{color:var(--mu);margin:6px 0}
ul{padding-left:18px;color:var(--mu)}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;background:transparent;color:var(--tx);font:inherit}
button{padding:11px 18px;border-radius:10px;border:0;font:inherit;cursor:pointer;margin-top:10px}
.p{background:var(--ac);color:#fff}.s{background:transparent;color:var(--mu)}
#err{color:#d70015}
</style></head><body><div class="c" id="app"><p>Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
<script>
const sb = supabase.createClient("https://rrkhkhgdxhmogxxtbvyt.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJya2hraGdkeGhtb2d4eHRidnl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNTc3ODgsImV4cCI6MjEwMTYzMzc4OH0.zAWC-s3PVsYi_EIHibbqLkCQ0u095ppDh-2l_DA-_Pc");
const app = document.getElementById("app");
const id = new URLSearchParams(location.search).get("authorization_id");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function go(url){ location.href = url; }
async function main(){
  if(!id){ app.innerHTML = "<h1>Nothing to approve</h1><p>Open this page from the app you are connecting.</p>"; return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return signIn();
  if(!sb.auth.oauth){ app.innerHTML = "<h1>Could not load</h1><p>The sign-in library is out of date. Reload the page.</p>"; return; }
  const { data, error } = await sb.auth.oauth.getAuthorizationDetails(id);
  if(error || !data){ app.innerHTML = "<h1>Request expired</h1><p>"+esc(error?.message||"Go back and try connecting again.")+"</p>"; return; }
  // Already approved earlier: Supabase hands back the redirect straight away.
  if(data.redirect_url) return go(data.redirect_url);
  const scopes = String(Array.isArray(data.scope)?data.scope.join(" "):(data.scope||"")).split(/\s+/).filter(Boolean);
  app.innerHTML = `<img class="logo" src="/icons/icon-192.png" alt="Revora"><h1>Connect ${esc(data.client?.name||"this app")} to Revora?</h1>
    <p>Signed in as ${esc(session.user.email)}.</p>
    <p>It will be able to act as you, within your company's data:</p>
    <ul><li>See your ad accounts, ads, results, products and saved copy</li><li>Write copy, pause or resume ads, change budgets</li><li>Propose campaigns. Launching always needs your explicit approval.</li></ul>
    ${scopes.length?`<p style="font-size:13px">Scopes: ${esc(scopes.join(", "))}</p>`:""}
    <button class="p" id="ok">Allow</button> <button class="s" id="no">Cancel</button> <button class="s" id="sw">Not you? Switch account</button><p id="err"></p>`;
  document.getElementById("sw").onclick = async()=>{ await sb.auth.signOut(); signIn(); };
  document.getElementById("ok").onclick = async()=>{ const r = await sb.auth.oauth.approveAuthorization(id); r.error ? err(r.error.message) : go(r.data.redirect_url); };
  document.getElementById("no").onclick = async()=>{ const r = await sb.auth.oauth.denyAuthorization(id); r.error ? err(r.error.message) : go(r.data.redirect_url); };
}
function err(m){ document.getElementById("err").textContent = m; }
function signIn(){
  app.innerHTML = `<img class="logo" src="/icons/icon-192.png" alt="Revora"><h1>Sign in to Revora</h1><p>Sign in to continue connecting.</p>
    <input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="p" id="go">Sign in</button><p id="err"></p>`;
  document.getElementById("go").onclick = async()=>{
    const { error } = await sb.auth.signInWithPassword({ email: document.getElementById("em").value.trim(), password: document.getElementById("pw").value });
    error ? err(error.message) : main();
  };
}
main().catch(e=>{ app.innerHTML = "<h1>Something went wrong</h1><p>"+esc(e&&e.message||e)+"</p>"; });
</script></body></html>
