<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password · Revora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#ffffff; --panel:#ffffff; --panel2:#faf9f7;
  --border:#e7e3da; --borderStrong:#d6d1c4;
  --text:#14130f; --text2:#55524a; --muted:#8c887c;
  --accent:#1877F2; --accentDk:#0c5dc7;
  --accentBg:#e7f0fe; --accentBdr:#c5dbfc;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.55;display:flex;justify-content:center;align-items:center;min-height:100vh;}
.wrap{width:100%;max-width:400px;padding:20px;}
.box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px 28px;box-shadow:0 16px 48px -16px rgba(20,19,15,.14);}
h1{font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:600;margin-bottom:6px;}
.sub{font-size:12.5px;color:var(--muted);margin-bottom:22px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-size:12px;color:var(--text2);font-weight:500;}
input{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 14px;font-size:14px;font-family:inherit;width:100%;}
input:focus{outline:none;border-color:var(--accent);}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{font-size:12px;padding:10px;border-radius:8px;margin-bottom:16px;display:none;}
.msg.err{display:block;background:rgba(224,85,85,.10);color:#e05555;border:1px solid rgba(224,85,85,.22);}
.msg.ok{display:block;background:var(--accentBg);color:var(--accent);border:1px solid var(--accentBdr);}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:rot .65s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap"><div class="box">
  <h1>Reset your password</h1>
  <div class="sub">Pick a new password for your account.</div>
  <div id="msg" class="msg"></div>
  <form id="f">
    <div class="field"><label>New password</label><input id="pass" type="password" required minlength="6" placeholder="••••••••"></div>
    <div class="field"><label>Confirm new password</label><input id="pass2" type="password" required minlength="6" placeholder="••••••••"></div>
    <button type="submit" class="btn" id="btn">Set new password</button>
  </form>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = "https://rrkhkhgdxhmogxxtbvyt.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJya2hraGdkeGhtb2d4eHRidnl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNTc3ODgsImV4cCI6MjEwMTYzMzc4OH0.zAWC-s3PVsYi_EIHibbqLkCQ0u095ppDh-2l_DA-_Pc";
const sb = window.supabase.createClient(SUPA_URL, ANON);
const msg = document.getElementById("msg");
const btn = document.getElementById("btn");

// The recovery-link click lands here with the session already established
// (Supabase's own recovery flow, same hash-fragment mechanism as the invite
// magic link) -- if there's no session, the link was invalid or already used.
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    msg.textContent = "This reset link is invalid or has expired -- go back and request a new one.";
    msg.className = "msg err";
    document.getElementById("f").style.display = "none";
  }
}
init();

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pass = document.getElementById("pass").value;
  const pass2 = document.getElementById("pass2").value;
  msg.className = "msg";
  if (pass !== pass2) { msg.textContent = "Passwords don't match."; msg.className = "msg err"; return; }
  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div> Saving…';
  try {
    const { error } = await sb.auth.updateUser({ password: pass });
    if (error) throw error;
    msg.textContent = "Password updated. Redirecting…";
    msg.className = "msg ok";
    setTimeout(() => window.location.href = "dashboard_new.html", 800);
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "msg err";
    btn.disabled = false;
    btn.textContent = "Set new password";
  }
});
</script>
</body>
</html>
