<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set up your account · Revora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#ffffff; --panel:#ffffff; --panel2:#faf9f7;
  --border:#e7e3da; --borderStrong:#d6d1c4;
  --text:#14130f; --text2:#55524a; --muted:#8c887c;
  --accent:#1877F2; --accentDk:#0c5dc7;
  --accentBg:#e7f0fe; --accentBdr:#c5dbfc;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.55;display:flex;justify-content:center;align-items:center;min-height:100vh;}
.wrap{width:100%;max-width:440px;padding:20px;}
.box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px 28px;box-shadow:0 16px 48px -16px rgba(20,19,15,.14);}
h1{font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:600;margin-bottom:6px;}
.sub{font-size:12.5px;color:var(--muted);margin-bottom:22px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-size:12px;color:var(--text2);font-weight:500;}
input,select{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 14px;font-size:14px;font-family:inherit;width:100%;}
input:focus,select:focus{outline:none;border-color:var(--accent);}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{font-size:12px;padding:10px;border-radius:8px;margin-bottom:16px;display:none;}
.msg.err{display:block;background:rgba(224,85,85,.10);color:#e05555;border:1px solid rgba(224,85,85,.22);}
.msg.ok{display:block;background:var(--accentBg);color:var(--accent);border:1px solid var(--accentBdr);}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:rot .65s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}
.center{text-align:center;padding:20px 0;color:var(--muted);}

.wrap.wide{max-width:600px;}
.steps{display:flex;gap:6px;margin-bottom:22px;}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--border);}
.steps i.on{background:var(--accent);}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
.cards.one{grid-template-columns:1fr;}
.card{border:1px solid var(--border);border-radius:12px;padding:13px 14px;cursor:pointer;background:var(--panel);text-align:left;font:inherit;color:inherit;display:flex;gap:10px;align-items:flex-start;}
.card:hover{border-color:var(--borderStrong);}
.card.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg);}
.card .ic{font-size:20px;line-height:1.1;flex:none;}
.card b{display:block;font-size:13.5px;font-weight:600;}
.card span.d{display:block;font-size:12px;color:var(--muted);margin-top:2px;}
.lbl{font-size:12px;color:var(--text2);font-weight:600;margin:14px 0 8px;}
.nav{display:flex;gap:10px;margin-top:22px;}
.btn.ghost{background:transparent;color:var(--text2);border-color:var(--border);}
textarea{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 14px;font-size:14px;font-family:inherit;width:100%;min-height:96px;resize:vertical;}
textarea:focus{outline:none;border-color:var(--accent);}
.skip{display:block;text-align:center;margin-top:14px;font-size:12.5px;color:var(--muted);cursor:pointer;background:none;border:0;width:100%;}
@media(max-width:520px){.cards{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap"><div class="box" id="box">
  <div class="center">Checking your account…</div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = "https://rrkhkhgdxhmogxxtbvyt.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJya2hraGdkeGhtb2d4eHRidnl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNTc3ODgsImV4cCI6MjEwMTYzMzc4OH0.zAWC-s3PVsYi_EIHibbqLkCQ0u095ppDh-2l_DA-_Pc";
const sb = window.supabase.createClient(SUPA_URL, ANON);
const box = document.getElementById("box");
const inviteToken = new URLSearchParams(location.search).get("invite");
const profileMode = new URLSearchParams(location.search).get("profile") === "1";

async function init() {
  const { data: { session } } = await sb.auth.getSession();

  if (session) {
    // Already set up (e.g. they refreshed this page after joining) --
    // nothing to do here.
    const { data: profile } = await sb.from("profiles").select("company_id, role").eq("id", session.user.id).maybeSingle();
    if (profile?.company_id && profileMode && ["owner", "admin"].includes(profile.role)) { renderWizard(session, true); return; }
    if (profile?.company_id) { window.location.href = "dashboard_new.html"; return; }
  }

  if (inviteToken) {
    // Joining a team needs no existing session at all -- the form itself
    // creates the account (via accept-invite) the moment it's submitted.
    // No email field either: the invite already knows who this is for.
    renderJoin();
  } else if (session) {
    renderWizard(session, false);
  } else {
    window.location.href = "login.html";
  }
}

function phoneOk(v) { const d = String(v || "").replace(/\D/g, ""); return (d.length === 11 && d.startsWith("0")) || (d.length === 13 && d.startsWith("234")); }

function renderJoin() {
  box.innerHTML = `
    <h1>Join your team</h1>
    <div class="sub">You're joining via an invite link. This attaches your account to that team -- you'll only see their data, never anyone else's.</div>
    <div id="msg" class="msg"></div>
    <form id="f">
      <div class="field"><label>Your name</label><input id="name" placeholder="Full name" required></div>
      <div class="field"><label>Phone / WhatsApp number</label><input id="phone" type="tel" inputmode="tel" placeholder="08012345678" required><div style="font-size:11.5px;color:var(--muted,#888);margin-top:4px">Used to open your Revora payment account and for important alerts.</div></div>
      <div class="field"><label>Set a password</label><input id="pass" type="password" placeholder="••••••••" required minlength="6"></div>
      <div class="field"><label>Confirm password</label><input id="pass2" type="password" placeholder="••••••••" required minlength="6"></div>
      <button type="submit" class="btn" id="btn">Join team</button>
    </form>`;
  document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); submitJoin(); });
}

const TYPES = [
  ["health_wellness", "🌿", "Health & wellness", "Supplements, herbal, fitness"],
  ["beauty_skincare", "✨", "Beauty & skincare", "Creams, hair, makeup"],
  ["food_drinks", "🍲", "Food & drinks", "Meals, snacks, groceries"],
  ["fashion_clothing", "👗", "Fashion & clothing", "Wears, fabrics, accessories"],
  ["shoes_bags", "👟", "Shoes & bags", "Footwear, handbags"],
  ["perfume_fragrance", "🧴", "Perfume & fragrance", "Body spray, oils"],
  ["gadgets_electronics", "📱", "Gadgets & electronics", "Phones, accessories, appliances"],
  ["home_living", "🛋️", "Home & living", "Furniture, kitchen, decor"],
  ["baby_kids", "🧸", "Baby & kids", "Toys, baby care, school"],
  ["agro_farm", "🌾", "Agro & farm", "Produce, livestock, inputs"],
  ["services", "🛠️", "Services", "Agencies, repairs, bookings"],
  ["courses_digital", "🎓", "Courses & digital", "Training, ebooks, software"],
  ["real_estate", "🏠", "Real estate", "Land, rentals, property"],
  ["other", "➕", "Something else", "Tell us below"],
];
const CHANNELS = [["whatsapp", "WhatsApp chats"], ["website_cod", "Website, pay on delivery"], ["website_prepaid", "Website, pay online"], ["social_dm", "Instagram / Facebook DMs"], ["marketplace", "Marketplaces"], ["in_person", "Shop / in person"]];
const FULFIL = [["own_riders", "My own riders"], ["third_party_courier", "Courier companies"], ["pickup", "Customers pick up"], ["digital", "Nothing to deliver (digital or service)"]];
const TEAM_ROLES = [["buyers", "Media buyers who run ads"], ["care", "Customer care"], ["delivery", "Delivery agents"], ["admins", "Admins / managers"]];
const SIZES = ["1", "2-5", "6-20", "21-50", "50+"];
const SPEND = [["not_yet", "Not running ads yet"], ["under_100k", "Under ₦100k"], ["100k-500k", "₦100k – ₦500k"], ["500k-2m", "₦500k – ₦2m"], ["over_2m", "Over ₦2m"]];
const LANGS = [["pidgin_mix", "English with Pidgin flavour (recommended)"], ["english", "Plain English"], ["pidgin", "Mostly Pidgin"], ["yoruba_mix", "English with Yoruba flavour"], ["igbo_mix", "English with Igbo flavour"], ["hausa_mix", "English with Hausa flavour"]];
const GOALS = [["launch_ads", "Launch and manage ads"], ["track_orders", "Track orders"], ["whatsapp_sales", "Sell on WhatsApp"], ["delivery", "Manage delivery"], ["team_reporting", "See my team's results"], ["build_website", "Build a sales page / store"], ["payments", "Collect payments"]];

function renderWizard(session, isProfile) {
  document.querySelector(".wrap").classList.add("wide");
  const st = { step: 0, account_type: isProfile ? "company" : "", name: "", phone: "", company_name: "", team_roles: [], team_size: "", buyers_count: "", business_types: [], sales_channels: [], fulfilment: "", description: "", monthly_ad_spend: "", copy_language: "pidgin_mix", goals: [] };
  const steps = isProfile ? ["team", "sell", "about", "ai"] : ["type", "you", "sell", "about", "ai"];
  const toggle = (arr, v) => { const i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v); };
  const personal = () => st.account_type === "personal";

  function cards(items, selected, key, multi, one) {
    return `<div class="cards ${one ? "one" : ""}">${items.map(([v, ic, t, d]) => `<button type="button" class="card ${selected.includes ? (selected.includes(v) ? "on" : "") : selected === v ? "on" : ""}" data-k="${key}" data-v="${v}"><span class="ic">${ic}</span><span><b>${t}</b>${d ? `<span class="d">${d}</span>` : ""}</span></button>`).join("")}</div>`;
  }
  function chips(items, selected, key) {
    return `<div class="cards">${items.map(([v, t]) => `<button type="button" class="card ${selected.includes ? (selected.includes(v) ? "on" : "") : selected === v ? "on" : ""}" data-k="${key}" data-v="${v}"><span><b>${t}</b></span></button>`).join("")}</div>`;
  }

  function body(name) {
    if (name === "type") return `<h1>How will you use Revora?</h1><div class="sub">This sets up the right workspace for you. You can invite people later.</div>
      ${cards([["company", "🏢", "A company or team", "Owner or manager with media buyers, customer care or riders"], ["personal", "🧑‍💻", "Just me, as a media buyer", "One person running ads and orders. No company needed"]], st.account_type, "account_type", false, true)}`;
    if (name === "you") return `<h1>${personal() ? "About you" : "About you and your company"}</h1><div class="sub">${personal() ? "We'll create your personal workspace." : "This creates your own private workspace. Your data is never visible to any other company."}</div>
      <div class="field"><label>Your name</label><input id="name" value="${st.name}" placeholder="Full name"></div>
      ${isProfile ? "" : `<div class="field"><label>Phone / WhatsApp number</label><input id="phone" type="tel" inputmode="tel" value="${st.phone}" placeholder="08012345678"><div style="font-size:11.5px;color:var(--muted,#888);margin-top:4px">Used to open your Revora payment account and for important alerts.</div></div>`}
      ${personal() ? "" : `<div class="field"><label>Company name</label><input id="company_name" value="${st.company_name}" placeholder="e.g. Quality Herb Nigeria"></div>`}
      ${personal() ? "" : teamBlock()}`;
    if (name === "team") return `<h1>Your team</h1><div class="sub">Who will use Revora with you? You can invite them from Settings any time.</div>${teamBlock()}`;
    if (name === "sell") return `<h1>What do you sell?</h1><div class="sub">Pick everything that applies. We tune the dashboard, your product forms and the AI to your business.</div>
      ${cards(TYPES, st.business_types, "business_types", true)}
      <div class="lbl">Where do you sell?</div>${chips(CHANNELS, st.sales_channels, "sales_channels")}
      <div class="lbl">How do customers receive it?</div>${chips(FULFIL, st.fulfilment, "fulfilment")}`;
    if (name === "about") return `<h1>Tell us about the business</h1><div class="sub">A few lines about what you sell and who buys it. The AI reads this when it writes your ads.</div>
      <div class="field"><label>Company or product description</label><textarea id="description" placeholder="e.g. We sell natural body creams for dry skin in Lagos. Our customers are women 25-45 who order on WhatsApp and pay on delivery.">${st.description}</textarea></div>
      <div class="lbl">Monthly ad spend</div>${chips(SPEND, st.monthly_ad_spend, "monthly_ad_spend")}`;
    if (name === "ai") return `<h1>How should the AI write for you?</h1><div class="sub">Pick a style. You can change it any time, or ask for another language in chat.</div>
      <div class="field"><label>Ad copy language</label><select id="copy_language">${LANGS.map(([v, t]) => `<option value="${v}" ${st.copy_language === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      <div class="lbl">What do you want to do first?</div>${chips(GOALS, st.goals, "goals")}`;
    return "";
  }
  function teamBlock() {
    return `<div class="lbl">Who will you add?</div>${chips(TEAM_ROLES, st.team_roles, "team_roles")}
      <div class="lbl">Team size</div>${chips(SIZES.map(x => [x, x === "1" ? "Just me" : x + " people"]), st.team_size, "team_size")}
      ${st.team_roles.includes("buyers") ? `<div class="field" style="margin-top:12px"><label>How many media buyers?</label><input id="buyers_count" type="number" min="1" value="${st.buyers_count}" placeholder="e.g. 3"></div>` : ""}`;
  }
  function read() {
    for (const id of ["name", "phone", "company_name", "description", "copy_language", "buyers_count"]) { const el = document.getElementById(id); if (el) st[id] = el.value; }
  }
  function valid(name) {
    if (name === "type" && !st.account_type) return "Choose how you will use Revora.";
    if (name === "you") { if (!st.name.trim()) return "Enter your name."; if (!isProfile && !phoneOk(st.phone)) return "Enter a valid Nigerian phone number, e.g. 08012345678."; if (!personal() && !st.company_name.trim()) return "Enter your company name."; }
    if (name === "sell" && !st.business_types.length) return "Pick at least one thing you sell.";
    return "";
  }
  function draw() {
    const name = steps[st.step], last = st.step === steps.length - 1;
    box.innerHTML = `<div class="steps">${steps.map((_, i) => `<i class="${i <= st.step ? "on" : ""}"></i>`).join("")}</div>
      <div id="msg" class="msg"></div>${body(name)}
      <div class="nav">${st.step > 0 ? '<button type="button" class="btn ghost" id="back" style="width:auto;padding:12px 18px">Back</button>' : ""}<button type="button" class="btn" id="next">${last ? (isProfile ? "Save" : "Finish setup") : "Continue"}</button></div>
      ${isProfile ? '<button type="button" class="skip" id="later">Skip for now</button>' : ""}`;
    box.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => {
      read();
      const k = c.dataset.k, v = c.dataset.v;
      if (Array.isArray(st[k])) toggle(st[k], v); else st[k] = v;
      draw();
    }));
    document.getElementById("back")?.addEventListener("click", () => { read(); st.step--; draw(); });
    document.getElementById("later")?.addEventListener("click", () => { localStorage.setItem("rv_onb_snooze", String(Date.now() + 3 * 86400000)); location.href = "dashboard_new.html"; });
    document.getElementById("next").addEventListener("click", async () => {
      read();
      const err = valid(name);
      const msg = document.getElementById("msg");
      if (err) { msg.textContent = err; msg.className = "msg err"; return; }
      if (!last) { st.step++; draw(); return; }
      await submit();
    });
  }
  async function submit() {
    const btn = document.getElementById("next"), msg = document.getElementById("msg");
    btn.disabled = true; btn.innerHTML = '<div class="spin"></div> Setting up…';
    const profile = {
      account_type: st.account_type, business_types: st.business_types, sales_channels: st.sales_channels, fulfilment: st.fulfilment || undefined,
      description: st.description, team_size: personal() ? "1" : st.team_size || undefined, buyers_count: personal() ? 1 : (st.buyers_count || undefined),
      monthly_ad_spend: st.monthly_ad_spend || undefined, copy_language: st.copy_language, goals: st.goals,
      team_roles: personal() ? [] : st.team_roles,
    };
    try {
      const res = await fetch(`${SUPA_URL}/functions/v1/complete-signup`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify(isProfile ? { mode: "profile", profile } : { mode: "create", display_name: st.name.trim() || undefined, phone: st.phone.trim() || undefined, company_name: personal() ? undefined : st.company_name.trim(), profile }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      msg.textContent = "All set! Taking you to your dashboard…"; msg.className = "msg ok";
      setTimeout(() => location.href = "dashboard_new.html", 600);
    } catch (e) {
      msg.textContent = e.message; msg.className = "msg err";
      btn.disabled = false; btn.textContent = isProfile ? "Save" : "Finish setup";
    }
  }
  draw();
}

function working(on) {
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");
  msg.className = "msg";
  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div> Working…';
  return { btn, msg };
}

function finish(msg, text) {
  msg.textContent = text;
  msg.className = "msg ok";
  setTimeout(() => window.location.href = "dashboard_new.html", 700);
}

function fail(btn, msg, err, label) {
  msg.textContent = err.message;
  msg.className = "msg err";
  btn.disabled = false;
  btn.textContent = label;
}

async function submitJoin() {
  const { btn, msg } = working();
  try {
    const name = document.getElementById("name").value.trim();
    const pass = document.getElementById("pass").value;
    const pass2 = document.getElementById("pass2").value;
    const phone = document.getElementById("phone").value.trim();
    if (!phoneOk(phone)) throw new Error("Enter a valid Nigerian phone number, e.g. 08012345678.");
    if (pass !== pass2) throw new Error("Passwords don't match.");

    // Creates the account directly from this submit -- a real click, not
    // an auto-fetchable link -- then we sign in with the same credentials.
    const acceptRes = await fetch(`${SUPA_URL}/functions/v1/accept-invite`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ invite_token: inviteToken, password: pass }),
    });
    const acceptData = await acceptRes.json();
    if (acceptData.error) throw new Error(acceptData.error);

    const { data: signInData, error: signInErr } = await sb.auth.signInWithPassword({ email: acceptData.email, password: pass });
    if (signInErr) throw signInErr;

    const res = await fetch(`${SUPA_URL}/functions/v1/complete-signup`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${signInData.session.access_token}` },
      body: JSON.stringify({ mode: "join", invite_token: inviteToken, display_name: name || undefined, phone }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    finish(msg, "All set! Redirecting…");
  } catch (err) {
    fail(btn, msg, err, "Join team");
  }
}

init();
</script>
</body>
</html>
