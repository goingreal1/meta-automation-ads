<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<title>Revora</title>
<style>
:root{--text:#14130f;--text2:#55524a;--muted:#8c887c;--border:#e7e3da;--accent:#1877F2;--bg:#f5f5f2;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:30px 28px;width:100%;max-width:400px;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:19px;margin-bottom:22px}
.brand img{width:30px;height:30px;border-radius:8px}
h1{font-size:21px;margin-bottom:8px;letter-spacing:-.01em}
p{color:var(--text2);font-size:15px;line-height:1.55}
.spin{width:22px;height:22px;border:3px solid #dcd8cc;border-top-color:var(--accent);border-radius:50%;animation:r .7s linear infinite;margin:18px auto 0}
@keyframes r{to{transform:rotate(360deg)}}
a.btn{display:inline-block;margin-top:18px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:12px 24px;border-radius:99px}
@media (prefers-color-scheme:dark){:root{--text:#f4f2ec;--text2:#b9b6ac;--border:#2c2b27;--bg:#0f0f0d}.card{background:#1b1b18}}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><img src="/images/brands/revora-logo-64.png" alt="" width="30" height="30">Revora</div>
  <div id="work"><h1>Checking your link…</h1><p>One moment.</p><div class="spin"></div></div>
  <div id="bad" style="display:none"><h1>This link has expired</h1><p>It may have been used already, or it is too old. Go back and ask for a new one.</p><a class="btn" href="/login">Back to log in</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Email links point here (our own address) instead of a raw Supabase URL. The code in the link is checked by script, so an email
// scanner that merely opens the link cannot use it up. Recovery goes to the new-password page; everything else to account setup.
const SUPA_URL = "https://oicqtpjjwmgsiluvkmpu.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pY3F0cGpqd21nc2lsdXZrbXB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5NDQyOTUsImV4cCI6MjExMDUyMDI5NX0.2Psx3_IHVSTL0wY0G6Y8M7IjNCtQi2RDKM0GG4WtMto";
const sb = window.supabase.createClient(SUPA_URL, ANON);
(async () => {
  const q = new URLSearchParams(location.search);
  const tokenHash = q.get("token_hash"), type = q.get("type");
  const fail = () => { document.getElementById("work").style.display = "none"; document.getElementById("bad").style.display = "block"; };
  if (!tokenHash || !["signup", "recovery", "invite", "magiclink", "email_change", "email"].includes(type)) return fail();
  const { error } = await sb.auth.verifyOtp({ token_hash: tokenHash, type });
  if (error) return fail();
  // "next" (last parameter) may carry an invite token; only our own addresses are accepted.
  let next = "";
  const m = location.search.match(/[?&]next=(.*)$/);
  if (m) { try { const u = new URL(decodeURIComponent(m[1])); if (/(^|\.)revoracrm\.(online|app)$/.test(u.hostname)) next = u.pathname.replace(/\.html$/, "") + u.search; } catch (_) {} }
  location.replace(type === "recovery" ? "/reset-password" : (next || "/setup-company"));
})();
</script>
</body>
</html>
